<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 132" role="img" aria-labelledby="title desc">
  <title id="title">FORCE field logo</title>
  <desc id="desc">The word FORCE beneath a blue football-field arc with yard-line ticks.</desc>
  <defs>
    <linearGradient id="fieldBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2586ff"/>
      <stop offset="0.52" stop-color="#4aa9ff"/>
      <stop offset="1" stop-color="#8dd7ff"/>
    </linearGradient>
    <linearGradient id="typeWhite" x1="0" y1="0" x2="0" y2="1">
