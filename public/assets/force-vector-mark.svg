<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 150" role="img" aria-labelledby="t d">
  <title id="t">FORCE vector F mark</title>
  <desc id="d">A geometric F built from teal, gold, and crimson forward vectors, with a single continuous crimson lower arm, integrated accent striping, and three trailing accent bars.</desc>
  <defs>
    <linearGradient id="teal" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#0a5e56"/><stop offset=".34" stop-color="#11b893"/><stop offset=".62" stop-color="#33f0c1"/><stop offset="1" stop-color="#1a8b76"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#9b5a17"/><stop offset=".38" stop-color="#f0ae2f"/><stop offset=".65" stop-color="#ffe37c"/><stop offset="1" stop-color="#b97a22"/></linearGradient>
    <linearGradient id="red" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#6e1428"/><stop offset=".45" stop-color="#c72048"/><stop offset=".7" stop-color="#ff5b74"/><stop offset="1" stop-color="#991f33"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset=".45" stop-color="#f5f7fa"/><stop offset="1" stop-color="#a8b6c3"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".75"/><stop offset=".18" stop-color="#ffffff" stop-opacity=".34"/><stop offset=".36" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffb34f" flood-opacity=".22"/></filter>
  </defs>
